name: Build and Package

env:
  PATH_TO_EXTENSION: "src/Slimsy"

  DOTNET_VERSION: '10'

on:
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: 'Publish to nuget.org'
        required: false
        type: boolean
        default: false

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0
      
      - name: Fetch all tags
        run: git fetch --force --tags
        
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          dry_run: false
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            conventional-changelog-conventionalcommits

      - name: Echo the version
        run: |
          echo "New release version: '${{ steps.semantic.outputs.new_release_version }}'"
          echo "New release major: '${{ steps.semantic.outputs.new_release_major_version }}'"
          echo "New release minor: '${{ steps.semantic.outputs.new_release_minor_version }}'"
          echo "New release patch: '${{ steps.semantic.outputs.new_release_patch_version }}'"
          echo "Last release version: '${{ steps.semantic.outputs.last_release_version }}'"
          echo "New release published: '${{ steps.semantic.outputs.new_release_published }}'"
  
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet
      id: nuget-packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-cache-${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj*') }}
        restore-keys: |
          nuget-cache-${{ runner.os }}-nuget-

    - name: Update Version Files
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: |
        jq '.version = "${{ needs.setup.outputs.semver }}"' wwwroot/umbraco-package.json > temp.json && mv temp.json wwwroot/umbraco-package.json

        # Convert semantic version to numeric file version (e.g., 2.0.0-alpha.1 -> 2.0.0.1)
        SEMVER="${{ needs.setup.outputs.semver }}"
        if [[ $SEMVER == *"-"* ]]; then
          BASE_VERSION=$(echo $SEMVER | cut -d'-' -f1)
          PRERELEASE=$(echo $SEMVER | cut -d'-' -f2)
          # Extract number from prerelease (e.g., alpha.1 -> 1, beta.2 -> 2)
          PRERELEASE_NUM=$(echo $PRERELEASE | grep -o '[0-9]\+$' || echo "0")
          FILE_VERSION="${BASE_VERSION}.${PRERELEASE_NUM}"
        else
          FILE_VERSION="${SEMVER}.0"
        fi
        
        # Find and update csproj file
        CSPROJ_FILE=$(find . -name "*.csproj" -not -path "*/bin/*" -not -path "*/obj/*" | head -1)
        sed -i "s|<FileVersion>.*</FileVersion>|<FileVersion>$FILE_VERSION</FileVersion>|" "$CSPROJ_FILE"
        sed -i "s|<InformationalVersion>.*</InformationalVersion>|<InformationalVersion>$SEMVER</InformationalVersion>|" "$CSPROJ_FILE"   

    - name: Build slnx
      run: dotnet build ${{ github.workspace }}/*.slnx -c Release        

    - name: Pack NuGet Package
      working-directory: ${{ env.PATH_TO_EXTENSION }}
      run: dotnet pack --configuration Release /p:PackageVersion=${{ needs.setup.outputs.semver }}
    
    - name: Login
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: dotnet nuget add source --username USERNAME --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/Jeavon/index.json"

    - name: Push NuGet Package
      if: ${{ needs.setup.outputs.new_release_published == 'true' }}
      run: dotnet nuget push "${{ env.PATH_TO_EXTENSION }}/bin/Release/Our.Umbraco.Slimsy.*.nupkg"  --api-key ${{ secrets.GITHUB_TOKEN }} --source "github" --skip-duplicate
    
    - name: Push MyGet Package
      if: needs.setup.outputs.new_release_published == 'true'
      env:
        MYGET_API_KEY: ${{ secrets.MYGET_API_KEY }}
      run: |
        if [ -n "$MYGET_API_KEY" ]; then
          dotnet nuget push "${{ env.PATH_TO_EXTENSION }}/bin/Release/Our.Umbraco.Slimsy.*.nupkg" --api-key $MYGET_API_KEY --source https://www.myget.org/F/umbraco-packages/api/v2/package --skip-duplicate
        else
          echo "MYGET_API_KEY is not set, skipping MyGet push"
        fi
      
    - name: Push to Nuget.org
      if: ${{ needs.setup.outputs.new_release_published == 'true' && github.event.inputs.publish_to_nuget == 'true' && startsWith(github.ref, 'refs/heads/main-') && !contains(needs.setup.outputs.semver, '-') }}
      run: dotnet nuget push "${{ env.PATH_TO_EXTENSION }}/bin/Release/Our.Umbraco.Slimsy.*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
    
    - name: Merge main branch to dev
      if: ${{ needs.setup.outputs.new_release_published == 'true' && startsWith(github.ref, 'refs/heads/main-') }}
      run: |
        # Extract version from main branch (e.g., main-v7 -> v7)
        CURRENT_BRANCH=${GITHUB_REF#refs/heads/}
        VERSION_SUFFIX=$(echo $CURRENT_BRANCH | sed 's/main-//')
        DEV_BRANCH="dev-$VERSION_SUFFIX"
        
        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Fetch the dev branch
        git fetch origin $DEV_BRANCH
        
        # Checkout dev branch
        git checkout $DEV_BRANCH
        
        # Merge main branch into dev
        git merge --no-ff origin/$CURRENT_BRANCH -m "chore: merge $CURRENT_BRANCH into $DEV_BRANCH after release ${{ needs.setup.outputs.semver }}"
        
        # Push changes
        git push origin $DEV_BRANCH
      
